<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Protótipo </title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}#v{position:fixed;inset:0}.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 24px;color:#fff;font-weight:700;background:linear-gradient(#0009,#0000);pointer-events:none}.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(#0000,#000a)}.nav button{flex:none;border:0;border-radius:20px;padding:9px 14px;background:#fff3;color:#fff;font:600 14px system-ui}.nav button.on{background:#fff;color:#000}.vb{position:relative;overflow:hidden;touch-action:none;background:#000}.vb canvas{display:block;width:100%;height:100%}.hl{position:absolute;inset:0;pointer-events:none}.hs{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;border-radius:24px;padding:9px 14px;background:rgba(0,0,0,.6);color:#fff;font:600 14px system-ui;display:none;white-space:nowrap}.hs:before{content:"➜ "}</style></head><body><div id="v"></div><div class="top">Protótipo </div><div class="nav" id="nav"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>var TOUR={"t":"Protótipo ","s":[{"id":"c2","name":"near-sala","hs":[]}]};function makeViewer(box,cb){
 cb=cb||{};box.classList.add('vb');

 frame();
